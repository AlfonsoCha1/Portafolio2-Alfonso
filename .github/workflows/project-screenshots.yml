name: Capturas de proyectos

# Toma capturas reales de las páginas públicas de los proyectos.
# Las deja en la rama temporal "capturas-tmp" para revisarlas antes de usarlas.
# Se ejecuta solo a mano (Actions → Capturas de proyectos → Run workflow).
on:
  workflow_dispatch:
  push:
    branches: [proyecto-tienda-smuckys]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --experimental-strip-types scripts/capture-screenshots.mjs
        env:
          ONLY: smuckys-by-chavamon
      - name: Mostrar captura (temporal)
        run: |
          sudo apt-get install -y -qq webp >/dev/null
          ls -la capturas
          cwebp -quiet -resize 1200 750 -q 82 capturas/smuckys-by-chavamon.png -o captura.webp
          ls -la captura.webp
          echo "INICIO_CAPTURA"
          base64 -w 0 captura.webp
          echo
          echo "FIN_CAPTURA"
